[workspace]
resolver = "3"
members = ["crates/server", "crates/llm", "crates/irodori", "crates/hfcache", "crates/eg2", "crates/d1"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
candle-core = "0.11"
candle-nn = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# candle-kernels 0.11.0 は CUDA 12.2 以降 + sm_80 未満 (RTX 20 系など) で __hmax_nan の二重定義になり
# ビルドできない。candle main の修正を当てた版を使う (candle の次のリリースで外す)。
[patch.crates-io]
candle-kernels = { path = "vendor/candle-kernels" }
