[package]
name = "audio-drama-editor"
description = "Audio drama editor: REST API, TTS worker and the bundled web UI"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "audio-drama-editor"
path = "src/main.rs"

[features]
metal = ["irodori/metal", "eg2/metal", "d1/metal"]
cuda = ["irodori/cuda", "eg2/cuda", "d1/cuda"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
candle-core.workspace = true
d1 = { path = "../d1" }
eg2 = { path = "../eg2" }
irodori = { path = "../irodori" }
llm = { path = "../llm" }
reqwest.workspace = true
rust-embed = { version = "8.13", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
